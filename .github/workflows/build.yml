name: Сборка ModGate, ModSync и PixelUI

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'mod/**'
      - 'tools/**'
      - 'manifest-source.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21 — для плагина, Java 25 — для запуска Gradle с Fabric Loom (мод всё равно собирается под Java 21)
      - name: Java 21 и 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Сборка плагина ModGate
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle -p plugin/ModGate build --no-daemon --stacktrace

      - name: Сборка мода ModSync
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: gradle -p mod/ModSync build --no-daemon --stacktrace

      - name: Сборка мода PixelUI
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: gradle -p mod/PixelUI build --no-daemon --stacktrace

      - name: Сборка плагина PixelUI-Paper
        if: hashFiles('plugin/PixelUI/build.gradle.kts') != ''
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle -p plugin/PixelUI build --no-daemon --stacktrace

      - name: Копирую jar в downloads/
        run: |
          mkdir -p downloads
          rm -f downloads/ModGate-*.jar downloads/ModSync-*.jar downloads/PixelUI-*.jar
          cp plugin/ModGate/build/libs/ModGate-*.jar downloads/
          for f in mod/ModSync/build/libs/ModSync-*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" downloads/ ;; esac
          done
          for f in mod/PixelUI/build/libs/PixelUI-*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) ;; *) cp "$f" downloads/ ;; esac
          done
          if [ -d plugin/PixelUI/build/libs ]; then cp plugin/PixelUI/build/libs/PixelUI-Paper-*.jar downloads/; fi
          ls -la downloads

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: downloads/*.jar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сборка manifest.json
        run: |
          pip install --quiet cryptography
          python tools/manifest.py build

      - name: Подпись manifest.json
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
        run: |
          if [ -z "$MANIFEST_PRIVATE_KEY" ]; then
            echo "::warning::Секрет MANIFEST_PRIVATE_KEY не задан — манифест не подписан, ModSync не будет ничего скачивать"
          else
            python tools/manifest.py sign
            python tools/manifest.py verify
          fi

      - name: Публикация на сайт (коммит в main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads manifest.json
          [ -f manifest.json.sig ] && git add manifest.json.sig
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "CI: сборка и манифест [skip ci]"
            git push
          fi
