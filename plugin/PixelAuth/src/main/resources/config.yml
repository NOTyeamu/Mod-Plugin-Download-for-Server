# =====================================================================
#  PixelAuth — авторизация на сервере (замена AuthMe)
#  Игроки с модом PixelUI видят пиксельное окно входа, остальные — чат,
#  титры и боссбар с таймером.
#  Переезд с AuthMe: поставьте PixelAuth, выполните /pixelauth import-authme,
#  затем удалите AuthMe и перезапустите сервер.
# =====================================================================

storage:
  # sqlite (файл plugins/PixelAuth/data.db) или mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    user: root
    password: ''
    params: 'useSSL=false&characterEncoding=utf8&serverTimezone=UTC'

login:
  # Сколько секунд даётся на вход/регистрацию, потом кик
  timeout-seconds: 60
  # Неверных паролей до кика
  max-attempts: 5
  # Сколько тиков ждать, пока мод PixelUI поздоровается (20 тиков = 1 с)
  ui-delay-ticks: 20
  # Напоминание в чате для игроков без мода, секунды
  reminder-seconds: 10

session:
  # Автовход, если игрок зашёл с того же IP в течение N минут после выхода
  enabled: true
  minutes: 30

register:
  max-accounts-per-ip: 3
  password-min: 6
  password-max: 64
  # Слишком простые пароли (сравнение без учёта регистра)
  unsafe-passwords: ['123456', '1234567', '12345678', '123456789', 'password', 'qwerty', 'qwerty123',
                     '111111', '123123', '000000', '1q2w3e4r', 'minecraft', 'parol', '654321']

# Защита от перебора: после N киков за неверный пароль IP блокируется на M минут
ip-block:
  kicks: 3
  minutes: 10

names:
  # Допустимые ники
  regex: '^[A-Za-z0-9_]{3,16}$'
  # Не пускать «Steve», если зарегистрирован «steve» (защита от подмены ника)
  case-sensitive: true

# Ограничения до входа: нельзя ходить, писать, ломать, получать урон и т.д.
limbo:
  blindness: true
  # Скрыть неавторизованного игрока от остальных
  hide-player: true
  # Держать на спавне мира до входа (потом вернём на место)
  teleport-to-spawn: false
  allowed-commands: [login, l, log, register, reg, forgotpassword, resetpassword, forgot]

bedrock:
  # Игроки Geyser/Floodgate входят автоматически (их уже проверил Xbox Live)
  auto-login: true
  prefix: '.'

hash:
  # Итерации PBKDF2-SHA256: больше — надёжнее, но медленнее (считается вне главного потока)
  iterations: 120000

# Сброс пароля: игрок жмёт «Забыли пароль?» (или /forgotpassword), админ одобряет
# (/pixelauth reset-accept <ник> или кнопка в чате), и игрок задаёт новый пароль при входе.
reset:
  enabled: true
  # Повторный запрос с того же ника или IP — не чаще, чем раз в N минут
  cooldown-minutes: 10
  # Одобренный сброс действует N часов
  valid-hours: 24
  # /pixelauth resets показывает запросы не старше N дней
  pending-days: 7
  # Задать новый пароль можно только с того же IP, с которого был запрос (защита от угона)
  require-same-ip: true

security:
  # Не писать в консоль «Игрок issued server command: /login пароль»
  hide-commands-in-console: true

compat:
  # Если рядом стоит AuthMe — PixelAuth не блокирует игроков (чтобы не было двойного входа),
  # работает только /pixelauth (для импорта)
  passive-if-authme: true

log:
  # Лог входов в plugins/PixelAuth/logins.log
  enabled: true

