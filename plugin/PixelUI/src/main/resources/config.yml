# PixelUI — серверная часть кастомного пиксельного интерфейса.
# Игроки с клиентским модом PixelUI видят настоящие кастомные окна.
# Для игроков без мода (ванилла, Bedrock) — запасной вариант ниже.

fallback:
  # Уведомления без мода: chat | actionbar | title | none
  notify: chat
  # Плашки без мода: bossbar | actionbar | none
  banner: bossbar
  # Меню без мода: chat (кликабельные кнопки в чате) | none
  menu: chat

# Писать в лог, когда игрок с модом PixelUI зашёл (и версию мода)
log-hello: true
