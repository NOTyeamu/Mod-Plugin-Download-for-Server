name: PluginSync
version: '${version}'
main: my.yeamu.pluginsync.PluginSyncPlugin
api-version: '1.21'
author: yeamu
description: Сам скачивает и обновляет плагины сервера (и себя) по подписанному списку с сайта.
website: https://yeamu.my.id
softdepend: [PixelUI]
commands:
  pluginsync:
    description: Обновление плагинов сервера
    usage: /pluginsync <status|check|update|restart|cancel|discard|reload>
    aliases: [psync]
    permission: pluginsync.admin
permissions:
  pluginsync.admin:
    description: Доступ к /pluginsync и уведомления об обновлениях
    default: op
